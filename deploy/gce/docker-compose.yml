# Dijalankan di VM dari clone repo: cd deploy/gce && docker compose up -d --build
# Panduan: docs/DEPLOY_GCE.md
# Backend HARUS 1 replika (node-cron + room Socket.io hidup di dalam proses).
name: unstoppable

services:
  backend:
    build: ../../backend
    image: unstoppable-backend:local
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      PORT: "4000"
      SPEECH_SERVICE_URL: http://voice:8080
    ports:
      - "127.0.0.1:4000:4000"     # hanya nginx (di host) yang boleh mengakses
    healthcheck:
      # /health selalu 200 walau DB down (disengaja); deploy.sh mengecek field "db".
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s           # prisma migrate deploy jalan dulu
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  voice:                          # opsional: aktif bila COMPOSE_PROFILES=voice di deploy/gce/.env
    profiles: ["voice"]
    build: ../../voice-microservices
    image: unstoppable-voice:local
    restart: unless-stopped
    env_file: ./voice.env
    expose: ["8080"]              # hanya terjangkau dari container backend
    mem_limit: 2g                 # cegah Whisper menelan RAM backend
    logging: *logging
