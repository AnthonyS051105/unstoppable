# Salin ke /etc/nginx/conf.d/unstoppable.conf di VM (sekali), lalu jalankan certbot.
# certbot --nginx akan menambah blok HTTPS dan redirect secara otomatis.
# Ganti server_name bila domain berubah.

# Dibutuhkan Socket.io (WebSocket upgrade)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name unstoppable-mu.duckdns.org;

  client_max_body_size 10m;       # foto laporan dan audio STT (default nginx hanya 1 MB)

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;      # transkripsi STT dan koneksi WebSocket
  }
}
