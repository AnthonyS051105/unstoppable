services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: unstoppable
      POSTGRES_PASSWORD: unstoppable
      POSTGRES_DB: unstoppable
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
